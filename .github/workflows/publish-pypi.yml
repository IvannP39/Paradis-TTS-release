name: Publish package to PyPI
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-pypi
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'IvannP39/Paradis-TTS-release' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}')
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the installed wheel outside the checkout
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tests/test_public_api.py"
      - name: Check real model download and default speech synthesis
        working-directory: ${{ runner.temp }}
        run: |
          python -I - <<'PY'
          import numpy as np
          from paradis_tts import ParadisTTS
          model = ParadisTTS()
          audio = model("Bonjour tout le monde.")
          assert model.postprocessing.dynamic_soften_db == 0
          assert audio.ndim == 1 and len(audio) > 24000 and np.isfinite(audio).all()
          print("Pinned model download and CPU synthesis passed", len(audio))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paradis-tts
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
