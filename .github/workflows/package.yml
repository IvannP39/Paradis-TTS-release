name: Package runtime
on:
  push:
    paths: ['paradis_tts/**', 'demo/**', 'pyproject.toml', 'setup.py', 'MANIFEST.in', '.github/workflows/package.yml', 'tests/test_public_api.py', 'tests/test_demo.py']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -p test_public_api.py
      - run: python -m unittest discover -s tests -p test_demo.py
      - name: Check installed wheel with a real model download
        working-directory: ${{ runner.temp }}
        run: |
          python -I - <<'PY'
          import numpy as np
          from paradis_tts import ParadisTTS
          model = ParadisTTS()
          audio = model("Bonjour tout le monde.")
          assert model.postprocessing.dynamic_soften_db == 0
          assert audio.ndim == 1 and len(audio) > 24000 and np.isfinite(audio).all()
          print("Pinned model download and CPU synthesis passed", len(audio))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paradis-tts-distributions
          path: dist/*
