name: Package runtime
on:
  push:
    paths: ['paradis_tts/**', 'pyproject.toml', 'setup.py', 'MANIFEST.in', '.github/workflows/package.yml', 'tests/test_public_api.py']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -p test_public_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: paradis-tts-distributions
          path: dist/*
